apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zero-trust-network-boundary
  namespace: zero-trust-system
spec:
  podSelector:
    matchLabels:
      app: zero-trust-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only to PEP ingress port 8001
    - ports:
        - protocol: TCP
          port: 8001
  egress:
    # Restrict egress to internal DNS and protected microservice perimeters
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
