version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zero-trust-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET_KEY=zero-trust-enterprise-portal-super-secret-key-2026
      - ENVIRONMENT=production
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zero-trust-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
